@if (isDev) {
  <div class="switcher" role="toolbar" aria-label="Prototype variant switcher">
    <button type="button" (click)="cycle(-1)" aria-label="Previous variant">‹</button>
    <span class="label">{{ currentVariant()?.key }} — {{ currentVariant()?.label }}</span>
    <button type="button" (click)="cycle(1)" aria-label="Next variant">›</button>
  </div>
}
