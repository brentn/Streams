<div class="band-wrap">
  <svg
    class="band"
    [attr.viewBox]="viewBox()"
    preserveAspectRatio="none"
    [style.height.px]="height()"
  >
    @if (colorBandEdges(); as edges) {
      <rect x="0" [attr.y]="edges.top" [attr.width]="viewWidth()" [attr.height]="edges.height" class="band-backing" />
    }
    @for (segment of colorSegments(); track $index) {
      <polygon
        [attr.points]="segment.polygon"
        class="band-fill"
        [class.total]="colorPalette() === 'total'"
        [class.positive]="segment.hue === 'positive'"
        [class.negative]="segment.hue === 'negative'"
        [style.fillOpacity]="segment.opacity"
      />
    }
    @for (group of groups(); track group.id) {
      <path
        [attr.d]="group.d"
        class="tributary group"
        [class.out]="group.direction === 'out'"
        [attr.data-group-id]="group.id"
      />
    }
  </svg>
  @for (arrow of tributaryArrows(); track arrow.id) {
    <div
      class="tributary-arrow"
      [class.out]="arrow.direction === 'out'"
      [style.left.%]="arrow.leftPercent"
      [style.top.%]="arrow.topPercent"
      [style.--shaft-width]="arrow.strokeWidth + 'px'"
      [style.--tick-length]="arrow.tickLength + 'px'"
      [attr.data-tributary-id]="arrow.id"
    >
      <span class="arrow-tick"></span>
      <span class="arrow-shaft">
        <span class="tributary-label">{{ arrow.label }}</span>
      </span>
    </div>
  }
  @if (projectedOverlay(); as overlay) {
    <div
      class="projected-overlay"
      [style.left.%]="overlay.leftPercent"
      [style.top.%]="overlay.topPercent"
      [style.width.%]="overlay.widthPercent"
      [style.height.%]="overlay.heightPercent"
    ></div>
  }
  @for (badge of groupBadges(); track badge.id) {
    <button
      type="button"
      class="tributary-badge"
      [style.left.%]="badge.leftPercent"
      [style.top.%]="badge.topPercent"
      [attr.data-group-id]="badge.id"
    >×{{ badge.count }}</button>
  }
  @if (expandedGroupMembers(); as group) {
    <div class="group-list" [style.top]="group.verticalStyle.top" [style.bottom]="group.verticalStyle.bottom">
      <div class="group-list-header">
        <span>{{ group.total | currency }}</span>
        <button type="button" class="group-list-close" data-group-close aria-label="Close list">×</button>
      </div>
      <ul>
        @for (member of group.members; track member.id) {
          <li>
            <button type="button" class="group-list-item" [attr.data-group-member-id]="member.id">
              <span class="name">{{ member.label }}</span>
              <span class="date">{{ member.date | date: 'MMM d' }}</span>
              <span class="amount">{{ member.amount | currency }}</span>
            </button>
          </li>
        }
      </ul>
    </div>
  }
</div>
