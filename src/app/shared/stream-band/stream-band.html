<div class="band-wrap">
  <svg
    class="band"
    [attr.viewBox]="viewBox()"
    preserveAspectRatio="none"
    [style.height.px]="height()"
  >
    @for (segment of segments(); track $index) {
      <polygon
        [attr.points]="segment.polygon"
        class="segment"
        [class.opposite]="segment.sign === 'opposite'"
        [class.neutral]="segment.sign === 'expected' && expectedColor() === 'neutral'"
        [class.projected]="segment.phase === 'projected'"
      />
    }
    @for (bundle of bundles(); track bundle.id) {
      <path
        [attr.d]="bundle.d"
        [attr.stroke-width]="bundle.strokeWidth"
        class="tributary bundle"
        [class.out]="bundle.direction === 'out'"
        (click)="onBundleClick(bundle.id)"
      />
    }
    @for (line of tributaryLines(); track line.id) {
      <path
        [attr.d]="line.d"
        [attr.stroke-width]="line.strokeWidth"
        class="tributary"
        [class.out]="line.direction === 'out'"
        (click)="onTributaryClick(line.id)"
      />
    }
  </svg>
  @for (label of tributaryLabels(); track label.id) {
    <span
      class="tributary-label"
      [style.left.%]="label.leftPercent"
      [style.top.%]="label.topPercent"
    >{{ label.text }}</span>
  }
  @for (badge of bundleBadges(); track badge.id) {
    <span
      class="tributary-badge"
      [style.left.%]="badge.leftPercent"
      [style.top.%]="badge.topPercent"
    >×{{ badge.count }}</span>
  }
  @if (isZoomed()) {
    <button type="button" class="zoom-close" (click)="closeZoom()" aria-label="Close zoomed cluster view">×</button>
  }
</div>
