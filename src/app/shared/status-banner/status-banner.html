@if (isSyncing()) {
  <div class="progress-bar" role="progressbar" aria-label="Syncing">
    <div class="progress-bar-fill"></div>
  </div>
}

@if (errorMessage(); as message) {
  <div
    class="error-banner"
    [class.severity-serious]="severity() === 'serious'"
    [class.severity-warning]="severity() === 'warning'"
    role="alert"
  >
    <app-alert-icon class="icon" />
    <span class="message">{{ message }}</span>
    <button type="button" class="retry" (click)="retry.emit()">{{ retryLabel() }}</button>
  </div>
}
