<span class="dot-badges">
  <button
    type="button"
    class="dot"
    [class.set]="stepChangeCount() > 0"
    (click)="openAmountChangeDialog('step')"
    title="Step Change"
  >
    ±{{ stepChangeCount() > 0 ? stepChangeCount() : '' }}
  </button>
  <button
    type="button"
    class="dot"
    [class.set]="recurringRuleCount() > 0"
    (click)="openAmountChangeDialog('recurring-rule')"
    title="Recurring Rule"
  >
    ↻{{ recurringRuleCount() > 0 ? recurringRuleCount() : '' }}
  </button>
</span>
