<div class="chip-group">
  <div class="calendar-chip" [class.bare]="bare()">
    <span class="month">{{ month() }}</span>
    <span class="day">{{ day() }}</span>
    @if (showYear()) {
      <span class="year">{{ year() }}</span>
    }
  </div>

  @if (interactive()) {
    <input
      type="date"
      class="picker-input"
      [min]="minValue()"
      [max]="maxValue()"
      [value]="dateInputValue(date())"
      (click)="openPicker($any($event.target))"
      (change)="onInputChange($any($event.target))"
    />
  }
</div>
