<div class="dialog">
  <h2>{{ data.transaction.matchedTarget ? 'Correct Match' : 'Assign Match' }}</h2>
  <p class="txn-summary">
    {{ data.transaction.description }} · {{ data.transaction.date | date: 'mediumDate' }} ·
    {{ data.transaction.amount | currency }}
  </p>

  @if (!isCreatingFlow()) {
    @if (formError(); as error) {
      <p class="form-error">{{ error }}</p>
    }

    <form (submit)="onSubmit($event)">
      <label>
        Match text
        <input
          type="text"
          [value]="matchText()"
          (input)="matchText.set($any($event.target).value)"
        />
      </label>
      <label>
        Flow or Transfer
        <select
          [value]="selectedTarget() ? encodeTarget(selectedTarget()!) : ''"
          (change)="onTargetChange($any($event.target).value)"
        >
          @if (availableFlows().length > 0) {
            <optgroup label="Flows">
              @for (flow of availableFlows(); track flow.id) {
                <option
                  [value]="encodeTarget({ kind: 'flow', id: flow.id })"
                  [selected]="selectedTarget()?.kind === 'flow' && selectedTarget()?.id === flow.id"
                >
                  {{ flow.name || '(unnamed)' }}
                </option>
              }
            </optgroup>
          }
          @if (data.transfers.length > 0) {
            <optgroup label="Transfers">
              @for (transfer of data.transfers; track transfer.id) {
                <option
                  [value]="encodeTarget({ kind: 'transfer', id: transfer.id })"
                  [selected]="selectedTarget()?.kind === 'transfer' && selectedTarget()?.id === transfer.id"
                >
                  {{ transferLabel(transfer) }}
                </option>
              }
            </optgroup>
          }
        </select>
      </label>
      <button type="button" class="new-flow" (click)="startCreatingFlow()">+ New Flow</button>

      <div class="form-actions">
        <button type="submit">Save</button>
        <button type="button" (click)="cancel()">Cancel</button>
      </div>
    </form>
  } @else {
    <app-flow-form
      [accountId]="data.transaction.accountId"
      (saved)="onFlowCreated($event)"
      (cancelled)="onFlowCreationCancelled()"
    />
  }
</div>
