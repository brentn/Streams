@if (account(); as account) {
  <section class="stream">
    <header>
      <div class="title">
        <a routerLink="/accounts" class="back" aria-label="All accounts">‹</a>
        <div>
          <h1>{{ account.name }}</h1>
          <p class="institution">{{ account.institutionName }}</p>
        </div>
      </div>
      <button type="button" class="resync" (click)="resync()" [disabled]="isSyncing()">
        {{ isSyncing() ? 'Syncing…' : 'Re-sync' }}
      </button>
    </header>

    <app-status-banner
      [errorMessage]="errorMessage()"
      [isSyncing]="isSyncing()"
      (retry)="resync()"
    />

    <div class="card">
      <div class="rhythm">
        <app-calendar-chip class="chip" [date]="selectedDate()" />

        <div class="chart" appDragScrub [windowDays]="windowDays" (scrubBy)="shiftDay($event)">
          <app-stream-band
            [points]="points()"
            [expectedSign]="account.expectedSign"
            [boundaryX]="boundaryX()"
            [maxAbsBalance]="maxAbsBalance()"
            [viewWidth]="windowDays"
            [height]="200"
          />
        </div>

        <p class="balance tabular-nums" [class.projected]="!isActual()" [class.opposite]="isOppositeSign()">
          {{ balance() | currency }}
          <span class="badge">{{ isActual() ? 'Actual' : 'Projected' }}</span>
        </p>

        <div class="accent-line"></div>
      </div>
    </div>

    <app-flow-list [accountId]="account.id" (changed)="reloadFlows()" />
  </section>
} @else {
  <p>Loading…</p>
}
