<form class="entity-form" (submit)="onSubmit($event)">
  <label>
    Name
    <input type="text" [value]="name()" (input)="name.set($any($event.target).value)" />
  </label>

  <label>
    Direction
    <select
      [value]="direction()"
      (change)="direction.set($any($event.target).value)"
    >
      <option value="in">In</option>
      <option value="out">Out</option>
    </select>
  </label>

  <label>
    Kind
    <select
      [value]="kind()"
      [disabled]="flow() !== null"
      (change)="kind.set($any($event.target).value)"
    >
      <option value="recurring">Recurring</option>
      <option value="budget">Budget</option>
    </select>
  </label>

  <label>
    {{ kind() === 'recurring' ? 'Amount' : 'Limit' }}
    <input
      type="number"
      step="0.01"
      [value]="amount()"
      (input)="amount.set($any($event.target).valueAsNumber)"
    />
  </label>

  <app-amount-changes-editor
    [changes]="amountChanges()"
    [amountLabel]="kind() === 'recurring' ? 'amount' : 'limit'"
    (changesUpdated)="amountChanges.set($event)"
  />

  @if (kind() === 'recurring') {
    <app-cadence-picker
      [option]="cadenceOption()"
      [fields]="cadenceFields()"
      (optionChanged)="cadenceOption.set($event)"
      (fieldsChanged)="cadenceFields.set($event)"
    />
  } @else {
    <label>
      Period
      <select
        [value]="budgetPeriod()"
        (change)="budgetPeriod.set($any($event.target).value)"
      >
        <option value="month">Month</option>
        <option value="year">Year</option>
      </select>
    </label>
  }

  <div class="form-actions">
    <button type="submit">{{ flow() === null ? 'Create' : 'Save' }}</button>
    <button type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
