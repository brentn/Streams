<form class="entity-form" (submit)="onSubmit($event)">
  <label>
    Direction
    <select [value]="direction()" (change)="direction.set($any($event.target).value)">
      <option value="out">Out (to another Account)</option>
      <option value="in">In (from another Account)</option>
    </select>
  </label>

  <label>
    {{ direction() === 'out' ? 'To Account' : 'From Account' }}
    <select [value]="otherAccountId()" (change)="otherAccountId.set($any($event.target).value)">
      @for (account of otherAccounts(); track account.id) {
        <option [value]="account.id" [selected]="account.id === otherAccountId()">
          {{ account.name }}
        </option>
      }
    </select>
  </label>

  <label>
    Amount
    <input
      type="number"
      step="0.01"
      [value]="amount()"
      (input)="amount.set(numberInputValue($event, amount()))"
    />
  </label>

  <app-amount-changes-editor
    [changes]="amountChanges()"
    amountLabel="amount"
    (changesUpdated)="amountChanges.set($event)"
  />

  <app-cadence-picker
    [option]="cadenceOption()"
    [fields]="cadenceFields()"
    (optionChanged)="cadenceOption.set($event)"
    (fieldsChanged)="cadenceFields.set($event)"
  />

  <div class="form-actions">
    <button type="submit" [disabled]="!isValid()">{{ transfer() === null ? 'Create' : 'Save' }}</button>
    <button type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
