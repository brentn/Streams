<section class="multi-account">
  <app-status-banner
    [errorMessage]="banner().message"
    [severity]="banner().severity"
    [retryLabel]="banner().retryLabel"
    [isSyncing]="isSyncing()"
    (retry)="onBannerAction()"
  />

  @if (lanes().length === 0) {
    <p class="empty">No accounts yet.</p>
  } @else {
    <div class="chip">
      <app-calendar-chip [date]="selectedDate()" (dateSelected)="onDateSelected($event)" />
    </div>

    <div
      class="lanes"
      appDragScrub
      [windowDays]="windowDays"
      (scrubBy)="shiftDay($event)"
      (tap)="onLaneTap($event)"
    >
      @for (lane of lanes(); track lane.account.id) {
        <div class="lane" [attr.data-account-id]="lane.account.id">
          <span class="lane-heading">
            <a
              class="lane-name"
              [routerLink]="['/accounts', lane.account.id]"
              (pointerdown)="$event.stopPropagation()"
              >{{ lane.account.name }}</a
            >
            @if (lane.syncIssueMessage; as message) {
              <app-sync-badge [message]="message" />
            }
            @if (lane.runningDryAlert; as alert) {
              <app-dry-alert-badge [alert]="alert" />
            }
          </span>
          <div class="lane-chart">
            <app-stream-band
              [points]="lane.points"
              [expectedSign]="lane.account.expectedSign"
              [boundaryX]="lane.boundaryX"
              [viewWidth]="windowDays"
              [height]="accountLaneHeight()"
            />
            <span class="pill tabular-nums" [class.opposite]="lane.isOpposite">
              {{ lane.balance | currency }}
            </span>
          </div>
        </div>
      }

      <div class="lane total-lane">
        <span class="lane-name">Total</span>
        <div class="lane-chart">
          <app-stream-band
            [points]="totalPoints()"
            [expectedSign]="1"
            [boundaryX]="totalBoundaryX()"
            [viewWidth]="windowDays"
            [height]="totalLaneHeight()"
            [colorPalette]="'total'"
            [colorDomain]="totalColorDomain()"
          />
          <span class="pill tabular-nums" [class.opposite]="totalIsOpposite()">
            {{ totalBalance() | currency }}
          </span>
        </div>
      </div>
    </div>
  }
</section>
