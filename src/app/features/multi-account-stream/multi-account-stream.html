<section class="multi-account">
  <header>
    <h1>Accounts</h1>
    <button type="button" class="resync" (click)="resync()" [disabled]="isSyncing()">
      {{ isSyncing() ? 'Syncing…' : 'Re-sync' }}
    </button>
  </header>

  <app-status-banner [errorMessage]="errorMessage()" [isSyncing]="isSyncing()" (retry)="resync()" />

  @if (lanes().length === 0) {
    <p class="empty">No accounts yet.</p>
  } @else {
    <app-calendar-chip class="chip" [date]="selectedDate()" />

    <div class="lanes" appDragScrub [windowDays]="windowDays" (scrubBy)="shiftDay($event)">
      <div class="lane total-lane">
        <span class="lane-name">Total</span>
        <div class="lane-chart">
          <app-stream-band
            [points]="totalPoints()"
            [expectedSign]="1"
            [boundaryX]="totalBoundaryX()"
            [maxAbsBalance]="totalMaxAbsBalance()"
            [viewWidth]="windowDays"
            [height]="totalLaneHeight()"
            expectedColor="neutral"
          />
          <span class="pill tabular-nums" [class.opposite]="totalIsOpposite()">
            {{ totalBalance() | currency }}
          </span>
        </div>
      </div>

      @for (lane of lanes(); track lane.account.id) {
        <div class="lane">
          <span class="lane-name">{{ lane.account.name }}</span>
          <div class="lane-chart">
            <app-stream-band
              [points]="lane.points"
              [expectedSign]="lane.account.expectedSign"
              [boundaryX]="lane.boundaryX"
              [maxAbsBalance]="lane.maxAbsBalance"
              [viewWidth]="windowDays"
              [height]="accountLaneHeight()"
            />
            <span class="pill tabular-nums" [class.opposite]="lane.isOpposite">
              {{ lane.balance | currency }}
            </span>
          </div>
        </div>
      }
    </div>
  }
</section>
