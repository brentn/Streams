<section class="settings">
  <h1>Settings</h1>

  <app-status-banner [errorMessage]="errorMessage()" [isSyncing]="isExporting()" (retry)="retry()" />

  <app-accounts-list
    [accounts]="accounts()"
    [editingAccountId]="editingAccountId()"
    [savingAccountId]="savingAccountId()"
    (edit)="editAccount($event)"
    (cancel)="cancelAccountEdit()"
    (saved)="onAccountSaved($event)"
  />

  <section class="backup">
    <h2>Backup</h2>
    <p>
      Export all locally stored data (Accounts, Transactions, Flows, Categorization Rules, and
      your SimpleFIN connection) to a file, or import a previously exported file to restore it.
    </p>

    <button type="button" (click)="exportData()" [disabled]="isExporting()">
      {{ isExporting() ? 'Exporting…' : 'Export data' }}
    </button>

    <app-backup-import (imported)="onBackupImported()" />
  </section>
</section>
