<form class="entity-form" (submit)="onSubmit($event)">
  <label>
    Name
    <input type="text" [value]="name()" (input)="name.set($any($event.target).value)" />
  </label>
  <label>
    Institution
    <input
      type="text"
      [value]="institutionName()"
      (input)="institutionName.set($any($event.target).value)"
    />
  </label>
  @if (!isLiability()) {
    <label>
      Minimum
      <input
        type="number"
        step="0.01"
        [value]="dryFloor()"
        (input)="dryFloor.set(numberInputValue($event, dryFloor()))"
      />
    </label>
  }
  <div class="form-actions">
    <button type="submit" [disabled]="!isValid() || isSaving()">
      {{ isSaving() ? 'Saving…' : 'Save' }}
    </button>
    <button type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
